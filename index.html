<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<meta name="description" content="ggrst.io：遊戲、程式、知識的部落格與遊戲存檔紀錄">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ggrst.io">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="ggrst.io">
<meta property="og:description" content="遊戲、程式、知識的部落格與遊戲存檔紀錄">
<meta property="og:url" content="https://ggrst.io/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#1C2140">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="alternate" type="application/rss+xml" title="ggrst.io" href="/feed.xml">
<style>
section{padding:112px 0}
h2{font-size:clamp(32px,4vw,48px);font-stretch:112%}
.lede{margin:12px 0 0;max-width:36em;color:var(--mute)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}

/* hero */
#top{padding:88px 0 112px}
#top .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center}
.hero-l h1{font-size:clamp(46px,6.6vw,92px);font-weight:900;font-stretch:118%;line-height:1.04;letter-spacing:-.025em;white-space:pre-line}
:lang(zh-Hant) .hero-l h1{letter-spacing:.01em;line-height:1.14}
.hero-l p{margin:28px 0 0;font-size:19px;max-width:30em;color:var(--mute)}
.hero-links{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}

/* save-file screen: the one loud element */
.screen{background:var(--screen);color:var(--on-screen);border-radius:22px;padding:22px;box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 30px 60px -30px rgba(28,33,64,.55)}
.screen-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 6px 16px;font-weight:700;font-size:15px}
.screen-head small{font-weight:500;color:var(--on-screen-mute);font-size:13px}
.slots{display:flex;flex-direction:column;gap:10px;min-height:120px}
.slot{width:100%;text-align:left;background:var(--screen-2);border:2px solid transparent;border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 16px;align-items:center;color:inherit;transition:border-color .15s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.slot:hover,.slot:focus-visible{border-color:var(--amber);transform:translateX(4px);outline:none}
.slot .no{grid-row:1/3;width:44px;height:44px;border-radius:10px;background:var(--screen);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;font-stretch:125%;color:var(--amber)}
.slot .nm{font-weight:700;font-size:16px;line-height:1.3;min-width:0}
.slot .pc{grid-row:1/3;grid-column:3;font-weight:900;font-size:26px;font-stretch:90%;font-variant-numeric:tabular-nums}
.slot .pc.done{color:var(--amber)}
a.slot{text-decoration:none}
.slot .go{grid-row:1/3;grid-column:3;color:var(--amber);font-size:22px;display:flex}
.slot .meta{font-size:13px;color:var(--on-screen-mute);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sbar{grid-column:1/4;height:6px;border-radius:99px;background:var(--screen);overflow:hidden;margin-top:10px}
.slot .sbar i,.gbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.screen-msg{margin:0;padding:18px 8px;color:var(--on-screen-mute);font-size:15px}
.screen-msg button,.state button{margin-left:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid currentColor;background:transparent;font-weight:700}

/* quest log (posts) */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.filters button{min-height:44px;padding:0 16px;background:none;border:none;border-radius:8px;font-weight:700;font-size:15px;color:var(--mute)}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.quests{margin:40px 0 0;padding:0;list-style:none;border-top:1.5px solid var(--ink)}
.quest{border-bottom:1px solid var(--line)}
.quest a{text-decoration:none;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 32px;align-items:baseline;padding:26px 0}
.quest .when{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.cat{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.cat i{width:10px;height:10px;border-radius:3px;flex:none}
.cat i.know{background:transparent;border:2px solid var(--ink)}
.quest h3{font-size:22px;font-weight:700}
.quest p{margin:6px 0 0;color:var(--mute);font-size:16px;max-width:60ch}
.quest .go{align-self:center;color:var(--mute);font-size:22px;transition:transform .2s cubic-bezier(.2,.8,.2,1),color .15s ease}
.quest a:hover h3{color:var(--cobalt)}
.quest a:hover .go{color:var(--cobalt);transform:translateX(4px)}
.state{margin:0;padding:32px 0;border-bottom:1px solid var(--line);color:var(--mute)}
.state a{color:var(--cobalt);font-weight:700}

/* save files (games) */
#games{background:var(--card);border-block:1px solid var(--line)}
.saves{margin-top:40px;display:flex;flex-direction:column;gap:14px}
.save{border:1px solid var(--line);border-radius:18px;background:var(--paper);scroll-margin-top:calc(var(--hdr) + 16px)}
.save.flash{animation:flash 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.save summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 18px;align-items:center;padding:20px 24px;border-radius:18px}
.save summary::-webkit-details-marker{display:none}
.save summary:hover .chev{color:var(--ink)}
.save .no{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;font-stretch:125%}
.save h3{font-size:22px}
.save .alt{display:block;margin-top:2px;font-size:14px;color:var(--mute);font-weight:500}
.save .info{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:14px;color:var(--mute)}
.status{font-weight:700;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.status.go{border-color:var(--ink)}
.status.done{background:var(--amber);border-color:var(--amber)}
.status.private{border-style:dashed;color:var(--mute)}
.save .pc{font-weight:900;font-size:28px;font-stretch:90%;font-variant-numeric:tabular-nums}
.chev{color:var(--mute);font-size:22px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.save[open] .chev{transform:rotate(180deg)}
.gbar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.gbar i{background:var(--ink)}
.gbar.done i{background:var(--amber)}
.save-body{padding:4px 24px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 48px}
.group-t{font-weight:700;font-size:14px;color:var(--mute);margin:0 0 8px}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ms li{display:flex;align-items:flex-start;gap:12px;padding:6px 0}
.box{flex:none;margin-top:3px;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center}
.ms li.done .box{background:var(--ink)}
.ms li.done .lbl{color:var(--mute)}
.coll{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.crow b{font-variant-numeric:tabular-nums}
.crow .mini{grid-column:1/-1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.crow .mini i{display:block;height:100%;background:var(--cobalt);transform-origin:left}
.related{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.related a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;min-height:44px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;text-decoration:none}
.related a:hover{border-color:var(--cobalt);color:var(--cobalt)}
.related time{flex:none;font-size:13px;font-weight:500;color:var(--mute)}
.note{margin:22px 0 0;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-line}
.save-map{grid-column:1/-1}

/* map */
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px;margin-bottom:14px;padding-top:24px;border-top:1px solid var(--line)}
.map-head h4{margin:0;font-size:20px}
.tally{font-weight:800;font-size:16px;padding:6px 14px;border-radius:10px;background:var(--ink);color:var(--paper)}
.tally b{color:var(--amber);font-variant-numeric:tabular-nums}
.ext{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;font-size:15px;color:var(--cobalt)}
.map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(92px,auto));grid-template-areas:'hebra hebra woodland woodland eldin akkala' 'tabantha tabantha ridgeland central eldin akkala' 'gerudo gerudo plateau central lanayru lanayru' 'gerudo gerudo plateau dueling hateno hateno' 'wasteland wasteland lake lake faron faron';gap:6px}
.reg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:var(--card)}
.reg[data-s="1"]{background:var(--amber);border-color:var(--amber)}
.reg[data-s="2"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.reg .nm{font-weight:800;font-size:16px;line-height:1.2}
.reg .sb{display:block;font-size:13px;font-weight:500;opacity:.8}
.reg .st{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600;font-size:13px}
.mark{font-weight:700;font-size:12px;padding:0 7px;border-radius:99px;border:1px solid currentColor}
.legend{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--mute)}
.legend .fine{color:var(--mute)}

/* continue screen */
#continue{background:var(--ink);color:var(--paper);padding-bottom:40px}
#continue h2{font-size:clamp(40px,6vw,76px);font-stretch:120%;font-weight:900}
#continue .lede{color:var(--on-screen-mute);font-size:19px}
.menu{margin:36px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-width:520px}
.menu a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:0 20px 0 36px;border-radius:12px;text-decoration:none;font-weight:700;font-size:19px;color:var(--on-screen-mute);transition:background .15s ease,color .15s ease}
.menu a::before{content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--amber);clip-path:polygon(0 0,100% 50%,0 100%);opacity:0;transform:translateX(-4px);transition:opacity .15s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.menu a:hover,.menu a:focus-visible,.menu li:first-child a{background:var(--screen-2);color:var(--paper)}
.menu a:hover::before,.menu a:focus-visible::before,.menu li:first-child a::before{opacity:1;transform:none}
.menu a:focus-visible{outline-color:var(--amber)}
.menu small{font-weight:500;font-size:14px;color:var(--on-screen-mute)}
footer{margin-top:96px;padding-top:20px;border-top:1px solid #343A66;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--on-screen-mute)}

/* responsive */
@media (max-width:900px){
  section{padding:80px 0}
  #top{padding:48px 0 80px}
  #top .wrap{grid-template-columns:minmax(0,1fr);gap:44px}
  .save-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .quest a{grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
  .quest .when{grid-column:1/-1;flex-direction:row;gap:14px}
  .quest .go{grid-column:2;grid-row:2}
  .slot{padding:14px}
  .save summary{grid-template-columns:auto minmax(0,1fr) auto;padding:16px}
  .save .pc{font-size:22px}
  .chev{display:none}
  .save-body{padding:4px 16px 22px}
  .map{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:none;grid-template-rows:none}
  .reg{grid-area:auto!important;min-height:80px}
}
</style>
</head>
<body>

<div class="wrap">
