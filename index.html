<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ggrst.io</title>
<meta name="description" content="ggrst.io — 遊戲、程式、知識的部落格與遊戲進度紀錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F8; --card:#FFFFFF; --ink:#1C2140; --cobalt:#3450F0; --amber:#FFB020;
  --mute:#666B8A; --line:#D6D9E4; --screen:#1C2140; --screen-2:#262C55; --on-screen:#E8EAF6;
  --sans:'Archivo','Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
.skip{position:absolute;left:16px;top:-60px;z-index:20;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
main:focus{outline:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:112px 0}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h2{font-size:clamp(32px,4vw,48px);font-stretch:112%}
.lede{margin:12px 0 0;max-width:36em;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;font-stretch:90%}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{text-decoration:none;font-weight:900;font-size:21px;font-stretch:125%;letter-spacing:-.02em}
.logo span{color:var(--cobalt)}
nav{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;color:var(--mute)}
nav a:hover{color:var(--ink);background:var(--card)}
#langBtn{margin-left:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;font-weight:700;font-size:14px}
#langBtn:hover{background:var(--ink);color:var(--paper)}

/* hero */
#top{padding:88px 0 112px}
#top .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center}
.hero-l h1{font-size:clamp(46px,6.6vw,92px);font-weight:900;font-stretch:118%;line-height:1.04;letter-spacing:-.025em;white-space:pre-line}
:lang(zh-Hant) .hero-l h1{letter-spacing:0;line-height:1.12}
.hero-l p{margin:28px 0 0;font-size:19px;max-width:30em;color:var(--mute)}
.hero-links{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}
.btn{text-decoration:none;min-height:52px;padding:0 24px;display:inline-flex;align-items:center;border-radius:12px;font-weight:700;font-size:16px;border:1.5px solid var(--ink)}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn-solid:hover{background:var(--cobalt);border-color:var(--cobalt)}
.btn-line:hover{background:var(--card)}

/* save-file screen (the one loud element) */
.screen{background:var(--screen);color:var(--on-screen);border-radius:22px;padding:22px;box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 30px 60px -30px rgba(28,33,64,.55)}
.screen-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 16px;font-weight:700;font-size:15px}
.screen-head small{font-weight:500;color:#9EA3C8;font-size:13px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{width:100%;text-align:left;background:var(--screen-2);border:2px solid transparent;border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center;color:inherit;transition:border-color .15s ease,transform .15s ease}
.slot:hover,.slot:focus-visible{border-color:var(--amber);transform:translateX(4px);outline:none}
.slot .no{grid-row:1/3;width:44px;height:44px;border-radius:10px;background:var(--screen);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;font-stretch:125%;color:var(--amber)}
.slot .nm{font-weight:700;font-size:16px;line-height:1.3;min-width:0}
.slot .pc{grid-row:1/3;grid-column:3;font-weight:900;font-size:26px;font-stretch:90%;font-variant-numeric:tabular-nums}
.slot .pc.done{color:var(--amber)}
.slot .meta{font-size:13px;color:#9EA3C8;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sbar{grid-column:1/4;height:6px;border-radius:99px;background:var(--screen);overflow:hidden;margin-top:10px}
.slot .sbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}

/* topics */
#topics{padding-top:0}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink)}
.topic{text-decoration:none;padding:32px 32px 32px 0;display:flex;flex-direction:column;gap:10px}
.topic + .topic{padding-left:32px;border-left:1px solid var(--line)}
.topic .t{font-weight:800;font-size:28px;font-stretch:115%;display:flex;align-items:center;gap:12px}
.topic .t i{width:12px;height:12px;border-radius:3px;flex:none}
.topic .d{color:var(--mute);max-width:24em}
.topic .m{margin-top:auto;padding-top:8px;font-weight:700;font-size:15px;color:var(--cobalt)}
.topic:hover .m{text-decoration:underline;text-underline-offset:4px}

/* games */
#games{background:var(--card);border-block:1px solid var(--line)}
.games{margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;align-items:start}
.game{border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:22px;background:var(--paper);scroll-margin-top:88px}
.game.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
.status{font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.status.done{background:var(--amber);border-color:var(--amber)}
.game h3{font-size:24px}
.game .alt{display:block;margin-top:4px;font-size:14px;color:var(--mute);font-weight:500}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transform-origin:left;transition:transform .3s ease}
.bar.done i{background:var(--amber)}
.group-t{font-weight:700;font-size:14px;color:var(--mute);margin-bottom:4px}
.ms{min-height:44px;padding:4px 0;background:none;border:none;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;width:100%}
.box{flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center;transition:background .15s ease}
.box svg{display:none}
.ms[aria-pressed="true"] .box{background:var(--ink)}
.ms[aria-pressed="true"] .box svg{display:block}
.ms[aria-pressed="true"] .lbl{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.counts{padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.count{width:72px;text-align:right;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);min-height:44px;font-variant-numeric:tabular-nums}
.count:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{font-size:15px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);resize:vertical;min-height:72px}
.note textarea:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}

/* map */
.mapcard{margin-top:24px;border:1px solid var(--line);border-radius:18px;padding:28px;background:var(--paper)}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.map-head h3{font-size:26px}
.map-head p{margin:4px 0 0;font-size:15px;color:var(--mute)}
.map-act{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.tally{font-weight:800;font-size:18px;padding:8px 16px;border-radius:10px;background:var(--ink);color:var(--paper)}
.tally b{color:var(--amber);font-stretch:90%;font-variant-numeric:tabular-nums}
.ext{font-weight:700;font-size:15px;color:var(--cobalt);text-underline-offset:4px}
.map-wrap{overflow-x:auto;padding:2px}
.map{min-width:720px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,104px);grid-template-areas:'hebra hebra woodland woodland eldin akkala' 'tabantha tabantha ridgeland central eldin akkala' 'gerudo gerudo plateau central lanayru lanayru' 'gerudo gerudo plateau dueling hateno hateno' 'wasteland wasteland lake lake faron faron';gap:6px}
.reg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;background:var(--card);transition:background .15s ease,color .15s ease}
.reg:hover{border-color:var(--ink)}
.reg[data-s="1"]{background:var(--amber);border-color:var(--amber)}
.reg[data-s="2"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.reg .nm{font-weight:800;font-size:16px;line-height:1.2}
.reg .sb{font-size:12px;opacity:.7}
.reg .st{font-weight:600;font-size:12px}
.mark{font-weight:700;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.legend .fine{color:var(--mute)}

/* posts */
.posts-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.filters button{min-height:44px;padding:0 16px;background:none;border:none;border-radius:8px;font-weight:700;font-size:15px;color:var(--mute)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.posts{margin:40px 0 0;padding:0;list-style:none;border-top:1.5px solid var(--ink)}
.post{border-bottom:1px solid var(--line)}
.post a{text-decoration:none;display:grid;grid-template-columns:120px 1fr auto;gap:8px 32px;align-items:baseline;padding:26px 0}
.post .cat{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.post .cat i{width:10px;height:10px;border-radius:3px}
.post h3{font-size:22px;font-weight:700}
.post p{margin:6px 0 0;color:var(--mute);font-size:16px}
.post time{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.post a:hover h3{color:var(--cobalt)}

/* about */
#about{background:var(--card);border-top:1px solid var(--line)}
#about .wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:64px;align-items:center}
.avatar{aspect-ratio:1;border-radius:24px;background:var(--paper);border:1px dashed var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-weight:600;padding:24px}
#about p{margin:20px 0 0;font-size:19px;max-width:34em}
.chips{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px}

/* contact */
#contact{background:var(--ink);color:var(--paper);padding-bottom:48px}
#contact h2{font-size:clamp(40px,6vw,76px);font-stretch:120%;font-weight:900}
#contact .lede{color:#B4B8D6;font-size:19px}
.links{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}
.links a{text-decoration:none;min-height:52px;padding:0 22px;display:inline-flex;align-items:center;border-radius:12px;font-weight:700;border:1.5px solid #4A5080}
.links a:hover{border-color:var(--amber);color:var(--amber)}
.links a.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.links a.primary:hover{background:var(--paper);border-color:var(--paper)}
footer{margin-top:96px;padding-top:20px;border-top:1px solid #343A66;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:#8A8FB5}

/* responsive */
@media (max-width:900px){
  section{padding:80px 0}
  #top{padding:56px 0 80px}
  #top .wrap,#about .wrap{grid-template-columns:minmax(0,1fr);gap:44px}
  .avatar{max-width:240px}
  .topics{grid-template-columns:minmax(0,1fr)}
  .topic,.topic + .topic{padding:28px 0;border-left:none}
  .topic + .topic{border-top:1px solid var(--line)}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  nav a{padding:0 8px;font-size:14px}
  .post a{grid-template-columns:minmax(0,1fr);gap:6px}
  .post time{order:-1}
  .game,.mapcard{padding:20px}
  .slot{padding:14px}
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>

<header>
<div class="wrap">
<a href="#top" class="logo">ggrst<span>.io</span></a>
<nav>
<a href="#games" data-i="navGames"></a>
<a href="#posts" data-i="navPosts"></a>
<a href="#about" data-i="navAbout"></a>
<a href="#contact" data-i="navContact"></a>
<button id="langBtn"></button>
</nav>
</div>
</header>

<main id="main" tabindex="-1">
<section id="top">
<div class="wrap">
<div class="hero-l">
<h1 data-i="heroTitle"></h1>
<p data-i="heroSub"></p>
<div class="hero-links">
<a href="#posts" class="btn btn-solid" data-i="cta1"></a>
<a href="#about" class="btn btn-line" data-i="cta2"></a>
</div>
</div>
<div class="screen">
<div class="screen-head"><span data-i="slotsTitle"></span><small data-i="slotsHint"></small></div>
<div class="slots" id="slots"></div>
</div>
</div>
</section>

<section id="topics">
<div class="wrap">
<div class="topics">
<a href="#games" class="topic"><span class="t"><i style="background:var(--amber)"></i><span data-i="game"></span></span><span class="d" data-i="gameDesc"></span><span class="m" data-i="seeGames"></span></a>
<a href="#posts" class="topic" data-filter="code"><span class="t"><i style="background:var(--cobalt)"></i><span data-i="code"></span></span><span class="d" data-i="codeDesc"></span><span class="m" data-i="seeCode"></span></a>
<a href="#posts" class="topic" data-filter="know"><span class="t"><i style="background:var(--ink)"></i><span data-i="know"></span></span><span class="d" data-i="knowDesc"></span><span class="m" data-i="seeKnow"></span></a>
</div>
</div>
</section>

<section id="games">
<div class="wrap">
<h2 data-i="gamesTitle"></h2>
<p class="lede" data-i="gamesSub"></p>
<div class="games" id="gameList"></div>

<article class="mapcard">
<div class="map-head">
<div>
<h3 data-i="mapTitle"></h3>
<p data-i="mapHint"></p>
</div>
<div class="map-act">
<span class="tally" aria-live="polite"><span data-i="towersLabel"></span> <b id="towerCount">0</b> / 15</span>
<a href="https://game8.co/games/LoZ-BotW/archives/292501" target="_blank" rel="noopener" class="ext" data-i="fullMap"></a>
</div>
</div>
<div class="map-wrap"><div class="map" id="map" role="group"></div></div>
<div class="legend">
<span><i class="sw" style="background:var(--card)"></i><b data-i="st0"></b></span>
<span><i class="sw" style="background:var(--amber);border-color:var(--amber)"></i><b data-i="st1"></b></span>
<span><i class="sw" style="background:var(--ink);border-color:var(--ink)"></i><b data-i="st2"></b></span>
<span class="fine" data-i="mapNote"></span>
</div>
</article>
</div>
</section>

<section id="posts">
<div class="wrap">
<div class="posts-head">
<h2 data-i="postsTitle"></h2>
<div class="filters" id="filters" role="group"></div>
</div>
<ul class="posts" id="postList"></ul>
</div>
</section>

<section id="about">
<div class="wrap">
<div class="avatar" data-i="avatarPh"></div>
<div>
<h2 data-i="aboutTitle"></h2>
<p data-i="aboutBody"></p>
<div class="chips">
<span class="chip" data-i="chip1"></span>
<span class="chip" data-i="chip2"></span>
<span class="chip" data-i="chip3"></span>
</div>
</div>
</div>
</section>

<section id="contact">
<div class="wrap">
<h2 data-i="contactTitle"></h2>
<p class="lede" data-i="contactSub"></p>
<div class="links">
<a href="mailto:hello@ggrst.io" class="primary" data-i="mailBtn"></a>
<a href="https://github.com/">GitHub</a>
<a href="https://x.com/">X</a>
<a href="https://discord.com/">Discord</a>
</div>
<footer><span>© 2026 ggrst.io</span><span data-i="footer"></span></footer>
</div>
</section>
</main>

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs) {
      if (a === 'text') n.textContent = attrs[a];
      else if (a === 'style') n.style.cssText = attrs[a];
      else if (a.slice(0, 2) === 'on') n.addEventListener(a.slice(2), attrs[a]);

  }

  function stats(g) {
    var n = 0;
    g.items.forEach(function (_, i) { if (S.done[g.id + ':' + i]) n++; });
    return { n: n, pct: Math.round(n / g.items.length * 100) };
  }

  var firstPaint = true;
  function renderSlots(t, zh) {
    var root = document.getElementById('slots');
    root.innerHTML = '';
    var bars = [];
    GAMES.forEach(function (g, idx) {
      var s = stats(g);
      var note = (S.notes[g.id] || '').trim().split('\n')[0];
      var fill = el('i');
      bars.push([fill, s.pct]);
      root.appendChild(el('button', { class: 'slot', 'aria-label': (zh ? g.zh : g.en) + ' ' + s.pct + '%',
        onclick: function () {
          var card = document.getElementById('g-' + g.id);
          card.scrollIntoView({ block: 'start' });
          card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
        } }, [
        el('span', { class: 'no', 'aria-hidden': 'true', text: String(idx + 1) }),
        el('span', { class: 'nm', text: zh ? g.zh : g.en }),
        el('span', { class: 'pc' + (s.pct === 100 ? ' done' : ''), text: s.pct + '%' }),
        el('span', { class: 'meta', text: t.slotMs + ' ' + s.n + '/' + g.items.length + '　' + (note || t.slotEmpty) }),
        el('span', { class: 'sbar', 'aria-hidden': 'true' }, [fill])
      ]));
    });
    var apply = function () { bars.forEach(function (b) { b[0].style.transform = 'scaleX(' + b[1] / 100 + ')'; }); };
    if (firstPaint) { firstPaint = false; requestAnimationFrame(function () { requestAnimationFrame(apply); }); }
    else { bars.forEach(function (b) { b[0].style.transition = 'none'; }); apply(); }
  }

  function renderGames(t, zh) {
    var root = document.getElementById('gameList');
    root.innerHTML = '';
    GAMES.forEach(function (g) {
      var s = stats(g), pct = s.pct;
      var name = zh ? g.zh : g.en;

      var ms = el('div', {}, [el('div', { class: 'group-t', text: t.milestones })]);
      g.items.forEach(function (it, i) {
        var key = g.id + ':' + i;
        var b = el('button', { class: 'ms', 'aria-pressed': S.done[key] ? 'true' : 'false', onclick: function () { S.done[key] = !S.done[key]; save(); render(key); } });
        b.setAttribute('data-key', key);
        var box = el('span', { class: 'box', 'aria-hidden': 'true' }); box.innerHTML = CHECK;
        b.appendChild(box); b.appendChild(el('span', { class: 'lbl', text: zh ? it[0] : it[1] }));
        ms.appendChild(b);
      });

      var col = el('div', { class: 'counts' }, [el('div', { class: 'group-t', text: t.collect })]);
      g.counts.forEach(function (c, i) {
        var key = g.id + ':' + i;
        var label = zh ? c[0] : c[1];
        var inp = el('input', { class: 'count', type: 'number', min: '0', max: String(c[2]), inputmode: 'numeric', 'aria-label': label, placeholder: '0' });
        if (S.counts[key] != null) inp.value = S.counts[key];
        inp.addEventListener('change', function () { var v = Math.max(0, Math.min(c[2], parseInt(inp.value, 10) || 0)); inp.value = v; S.counts[key] = v; save(); });
        col.appendChild(el('label', { class: 'row' }, [
          el('span', { text: label }),
          el('span', { class: 'num', style: 'display:flex;align-items:center;gap:8px;font-weight:700' }, [inp, el('span', { text: '/ ' + c[2] })])
        ]));
      });

      var ta = el('textarea', { 'aria-label': t.lastNote, placeholder: t.notePh });
      ta.value = S.notes[g.id] || '';
      ta.addEventListener('input', function () { S.notes[g.id] = ta.value; save(); });
      ta.addEventListener('change', function () { renderSlots(T[S.lang], S.lang === 'zh'); });

      var bar = el('div', { class: 'bar' + (pct === 100 ? ' done' : ''), role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct), 'aria-label': name }, [el('i', { style: 'transform:scaleX(' + pct / 100 + ')' })]);

      root.appendChild(el('article', { class: 'game', id: 'g-' + g.id }, [

          el('span', { class: 'status' + (pct === 100 ? ' done' : ''), text: pct === 100 ? t.cleared : t.playing }),
          el('span', { text: g.platform || t.platformPh })
        ]),
        el('h3', {}, [document.createTextNode(name), el('span', { class: 'alt', text: zh ? g.en : g.zh })]),
        el('div', { class: 'prog' }, [
          el('div', { class: 'row' }, [el('span', { text: t.progress }), el('span', { class: 'num', text: pct + '%' })]),
          bar
        ]),
        ms, col,
        el('label', { class: 'note' }, [el('span', { class: 'group-t', text: t.lastNote }), ta])

    });
  }

  function renderMap(t, zh) {
    var root = document.getElementById('map');
    root.setAttribute('aria-label', t.mapTitle);
    root.innerHTML = '';
    var labels = [t.st0, t.st1, t.st2], on = 0;

      if (r[3]) bottom.appendChild(el('span', { class: 'mark', text: t[r[3]] }));
      var b = el('button', { class: 'reg', 'data-s': String(s), 'data-key': 'map:' + r[0], style: 'grid-area:' + r[0], 'aria-label': name + '，' + labels[s],
        onclick: function () { S.towers[r[0]] = ((S.towers[r[0]] || 0) + 1) % 3; save(); render('map:' + r[0]); } }, [

  function renderPosts(t) {

      f.appendChild(b);

    var list = document.getElementById('postList');

    POSTS.filter(function (c) { return S.filter === 'all' || S.filter === c; }).forEach(function (c) {
      list.appendChild(el('li', { class: 'post' }, [

          el('span', { class: 'cat' }, [el('i', { style: 'background:' + CAT_COLOR[c] }), el('span', { text: t[c] })]),

  function render(focusKey) {
