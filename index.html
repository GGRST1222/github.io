*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk','Noto Sans TC',sans-serif}
a{color:var(--ink)}a:hover{color:var(--mid)}
button{cursor:pointer;font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:40px}
.mono{font-family:'JetBrains Mono',monospace}
.b3{border:3px solid var(--ink)}
.pill{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;display:inline-block}
.kick{align-self:flex-start;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;background:#fff}
h2{margin:0;font-weight:900;font-size:clamp(36px,4.5vw,56px);letter-spacing:-1px}
.btn{text-decoration:none;min-height:56px;padding:0 28px;display:inline-flex;align-items:center;border:3px solid var(--ink);border-radius:14px;font-weight:700;font-size:18px;color:var(--ink)}
.pop{transition:transform .15s ease,box-shadow .15s ease}
.pop:hover{transform:translate(-3px,-3px)}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink)}
section{border-bottom:3px solid var(--ink)}

header{border-bottom:3px solid var(--ink);background:var(--bg);position:sticky;top:0;z-index:10}
header .in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:44px;height:44px;background:var(--g);border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-style:normal;font-size:20px}
.logo b{font-size:22px;letter-spacing:-.5px}.logo b span{color:#6B6B6B}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav a{text-decoration:none;font-weight:700;padding:12px}
#langBtn{min-height:44px;padding:0 18px;background:var(--y);border:3px solid var(--ink);border-radius:999px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
/* hero */
#top{background:var(--ink);overflow:hidden}
#top .wrap{flex-direction:row;flex-wrap:wrap;align-items:center;gap:48px;padding-bottom:104px}
.hero-l{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:28px}
.hero-l h1{margin:0;font-weight:900;font-size:clamp(48px,7vw,104px);line-height:1.02;letter-spacing:-2px;color:#fff;white-space:pre-line}
.hero-l p{margin:0;max-width:560px;font-size:20px;line-height:1.6;color:#fff;font-weight:500}
.hero-r{flex:1 1 320px;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{aspect-ratio:1;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--sh);display:flex;align-items:center;justify-content:center}
/* topics */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.topic{text-decoration:none;color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:32px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:16px;min-height:240px}
.topic .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}
.topic .t{font-weight:900;font-size:40px}
.topic .d{font-size:18px;line-height:1.6;font-weight:500}
.topic .m{margin-top:auto;font-weight:700}
/* games */
#games{background:var(--g)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;align-items:start}
.game{padding:28px;display:flex;flex-direction:column;gap:20px}
.game h3{margin:0;font-weight:900;font-size:26px;line-height:1.25}
.lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--mid)}
.bar{height:22px;background:var(--bg);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-right:3px solid var(--ink);transition:width .25s ease}
.ms{min-height:44px;padding:6px 0;background:none;border:none;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;font-weight:500;width:100%}
.box{flex-shrink:0;width:26px;height:26px;border:3px solid var(--ink);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.ms[aria-pressed="true"] .box{background:var(--ink)}
.ms[aria-pressed="true"] .box svg{display:block}.box svg{display:none}
.row{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.count{width:64px;text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:8px;padding:4px 6px;background:#fff;min-height:36px}
.note{background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note textarea{font:inherit;font-size:15px;line-height:1.6;border:none;background:transparent;resize:vertical;min-height:52px;outline:none;color:var(--ink)}
/* map */
.map-wrap{overflow-x:auto;padding:4px 8px 12px 4px}
.map{min-width:720px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,112px);grid-template-areas:'hebra hebra woodland woodland eldin akkala' 'tabantha tabantha ridgeland central eldin akkala' 'gerudo gerudo plateau central lanayru lanayru' 'gerudo gerudo plateau dueling hateno hateno' 'wasteland wasteland lake lake faron faron';gap:10px;background:var(--bg);border:3px solid var(--ink);border-radius:20px;padding:12px}
.reg{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;text-align:left;background:#fff}
.reg[data-s="1"]{background:var(--y)}
.reg[data-s="2"]{background:var(--ink);color:#fff}
.reg .nm{font-weight:900;font-size:17px;line-height:1.2}
.reg .sb{font-size:12px;opacity:.8}
.reg .st{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px}
.mark{background:var(--y);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-weight:700;font-size:12px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;font-size:14px;font-weight:500}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px}
/* posts */
#posts{background:var(--y)}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters button{min-height:44px;padding:0 18px;background:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:700;font-size:16px}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.post{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.post .cv{height:140px;border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
.post .bd{padding:24px;display:flex;flex-direction:column;gap:12px;flex-grow:1}
.post h3{margin:0;font-weight:900;font-size:24px;line-height:1.3}
.post p{margin:0;font-size:16px;line-height:1.6;color:var(--mid)}
/* about */
#about .wrap{flex-direction:row;flex-wrap:wrap;align-items:center;gap:56px}
.avatar{flex:1 1 280px;min-width:0;max-width:360px;aspect-ratio:1;background:var(--g);border:3px solid var(--ink);border-radius:999px;box-shadow:10px 10px 0 var(--y);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;padding:24px}
/* contact */
#contact{background:var(--ink);color:#fff;border-bottom:none}
#contact h2{font-size:clamp(40px,6vw,80px);color:#fff}
.cbtn{text-decoration:none;min-height:56px;padding:0 24px;display:inline-flex;align-items:center;background:#fff;color:var(--ink);border:3px solid #fff;border-radius:14px;font-weight:700;font-size:17px;box-shadow:6px 6px 0 var(--sh)}
footer{margin-top:48px;padding-top:24px;border-top:2px solid var(--mid);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#BDBDBD}

    { id: 'acnh', color: '#FFD60A', platform: 'Switch',

      items: [['博物館開館', 'Open the museum'], ['蓋好商店', 'Build the shop'], ['蓋好裁縫店', 'Build the tailor shop'], ['舉辦 K.K. 演唱會', 'Host the K.K. concert'], ['島嶼評價五星', 'Reach a 5-star island rating']],
      counts: [['魚類', 'Fish', 80], ['昆蟲', 'Bugs', 80], ['海洋生物', 'Sea creatures', 40], ['化石', 'Fossils', 73], ['藝術品', 'Art', 43]] },
    { id: 'oot', color: '#8C8C8C', platform: null,
      zh: '薩爾達傳說 時之笛', en: 'The Legend of Zelda: Ocarina of Time',
      items: [['取得三顆精靈石', 'Collect the three Spiritual Stones'], ['通關 森林神殿', 'Clear the Forest Temple'], ['通關 火之神殿', 'Clear the Fire Temple'], ['通關 水之神殿', 'Clear the Water Temple'], ['通關 暗影神殿', 'Clear the Shadow Temple'], ['通關 魂之神殿', 'Clear the Spirit Temple'], ['擊敗加儂', 'Defeat Ganon']],
      counts: [['黃金蜘蛛', 'Gold Skulltulas', 100], ['心之碎片', 'Pieces of Heart', 36]] }
  ];

  var REGIONS = [
    ['hebra', '赫布拉', 'Hebra', ''], ['woodland', '森林', 'Woodland', ''], ['eldin', '艾爾汀', 'Eldin', 'beast'],
    ['akkala', '阿卡萊', 'Akkala', ''], ['tabantha', '塔邦塔', 'Tabantha', 'beast'], ['ridgeland', '山丘', 'Ridgeland', ''],
    ['central', '中央', 'Central', 'castle'], ['gerudo', '格魯德高地', 'Gerudo', ''], ['plateau', '初始台地', 'Great Plateau', 'start'],
    ['lanayru', '拉聶爾', 'Lanayru', 'beast'], ['dueling', '雙子山', 'Dueling Peaks', ''], ['hateno', '哈特諾', 'Hateno', ''],
    ['wasteland', '格魯德沙漠', 'Wasteland', 'beast'], ['lake', '海利亞湖', 'Lake', ''], ['faron', '費羅尼', 'Faron', '']
  ];

  var POSTS = ['game', 'code', 'know', 'code', 'game', 'know'];
  var CAT_BG = { game: '#D9D9D9', code: '#FFD60A', know: '#FFFFFF' };

  var KEY = 'ggrst-state-v1';
  var S = { lang: 'zh', filter: 'all', done: {}, towers: {}, counts: {}, notes: {} };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) for (var k in saved) S[k] = saved[k]; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs) {
      if (a === 'text') n.textContent = attrs[a];
      else if (a === 'style') n.style.cssText = attrs[a];
      else if (a.slice(0, 2) === 'on') n.addEventListener(a.slice(2), attrs[a]);
      else n.setAttribute(a, attrs[a]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function renderGames(t, zh) {
    var root = document.getElementById('gameList');
    root.innerHTML = '';
    GAMES.forEach(function (g) {
      var n = 0;
      g.items.forEach(function (_, i) { if (S.done[g.id + ':' + i]) n++; });
      var pct = Math.round(n / g.items.length * 100);
      var name = zh ? g.zh : g.en;

      var ms = el('div', { style: 'display:flex;flex-direction:column;gap:4px' }, [el('span', { class: 'lab', text: t.milestones })]);
      g.items.forEach(function (it, i) {
        var key = g.id + ':' + i;
        var b = el('button', { class: 'ms', 'aria-pressed': S.done[key] ? 'true' : 'false', onclick: function () { S.done[key] = !S.done[key]; save(); render(); } });
        var box = el('span', { class: 'box', 'aria-hidden': 'true' }); box.innerHTML = CHECK;
        b.appendChild(box); b.appendChild(el('span', { text: zh ? it[0] : it[1] }));
        ms.appendChild(b);
      });

      var col = el('div', { style: 'display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:2px dashed #141414' }, [el('span', { class: 'lab', text: t.collect })]);
      g.counts.forEach(function (c, i) {
        var key = g.id + ':' + i;
        var label = zh ? c[0] : c[1];
        var inp = el('input', { class: 'count', type: 'number', min: '0', max: String(c[2]), inputmode: 'numeric', 'aria-label': label, placeholder: '0' });
        if (S.counts[key] != null) inp.value = S.counts[key];
        inp.addEventListener('change', function () { var v = Math.max(0, Math.min(c[2], parseInt(inp.value, 10) || 0)); inp.value = v; S.counts[key] = v; save(); });
        col.appendChild(el('label', { class: 'row', style: 'align-items:center' }, [
          el('span', { style: 'font-weight:500', text: label }),
          el('span', { class: 'mono', style: 'display:flex;align-items:center;gap:8px;font-weight:700' }, [inp, el('span', { text: '/ ' + c[2] })])
        ]));
      });

      var ta = el('textarea', { 'aria-label': t.lastNote, placeholder: t.notePh });
      ta.value = S.notes[g.id] || '';
      ta.addEventListener('input', function () { S.notes[g.id] = ta.value; save(); });

      var bar = el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct), 'aria-label': name }, [el('i', { style: 'width:' + pct + '%;background:' + g.color })]);

      root.appendChild(el('article', { class: 'card game' }, [
        el('div', { class: 'row', style: 'align-items:center' }, [
          el('span', { class: 'pill', style: 'background:' + (pct === 100 ? '#FFD60A' : '#FFFFFF'), text: pct === 100 ? t.cleared : t.playing }),
          el('span', { class: 'mono', style: 'font-size:14px;color:#555', text: g.platform || t.platformPh })
        ]),
        el('div', { style: 'display:flex;flex-direction:column;gap:6px' }, [el('h3', { text: name }), el('span', { style: 'font-size:14px;color:#555', text: zh ? g.en : g.zh })]),
        el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, [
          el('div', { class: 'row', style: 'font-weight:700;font-size:15px' }, [el('span', { text: t.progress }), el('span', { class: 'mono', text: pct + '%' })]),
          bar
        ]),
        ms, col,
        el('label', { class: 'note' }, [el('span', { class: 'lab', text: t.lastNote }), ta])
      ]));
    });
  }

  function renderMap(t, zh) {
    var root = document.getElementById('map');
    root.setAttribute('aria-label', t.mapTitle);
    root.innerHTML = '';
    var labels = [t.st0, t.st1, t.st2], on = 0;
    REGIONS.forEach(function (r) {
      var s = S.towers[r[0]] || 0; if (s > 0) on++;
      var name = zh ? r[1] : r[2];
      var bottom = el('span', { style: 'display:flex;flex-wrap:wrap;align-items:center;gap:6px' }, [el('span', { class: 'st', text: labels[s] })]);
      if (r[3]) bottom.appendChild(el('span', { class: 'mark', text: t[r[3]] }));
      root.appendChild(el('button', { class: 'reg', 'data-s': String(s), style: 'grid-area:' + r[0], 'aria-label': name + ' · ' + labels[s],
        onclick: function () { S.towers[r[0]] = ((S.towers[r[0]] || 0) + 1) % 3; save(); render(); } }, [
        el('span', { style: 'display:flex;flex-direction:column;gap:2px' }, [el('span', { class: 'nm', text: name }), el('span', { class: 'sb', text: zh ? r[2] : r[1] })]),
        bottom
      ]));
    });
    document.getElementById('towerCount').textContent = on;
  }

  function renderPosts(t) {
    var f = document.getElementById('filters');
    f.setAttribute('aria-label', t.filterAria);
    f.innerHTML = '';
    ['all', 'game', 'code', 'know'].forEach(function (c) {
      f.appendChild(el('button', { 'aria-pressed': S.filter === c ? 'true' : 'false', text: t[c], onclick: function () { S.filter = c; save(); render(); } }));
    });
    var list = document.getElementById('postList');
    list.innerHTML = '';
    POSTS.filter(function (c) { return S.filter === 'all' || S.filter === c; }).forEach(function (c) {
      list.appendChild(el('article', { class: 'post pop' }, [
        el('div', { class: 'cv', 'aria-hidden': 'true', style: 'background:' + CAT_BG[c], text: t.coverPh }),
        el('div', { class: 'bd' }, [
          el('div', { class: 'row', style: 'align-items:center' }, [el('span', { class: 'pill', style: 'background:' + CAT_BG[c], text: t[c] }), el('span', { class: 'mono', style: 'font-size:14px;color:#555', text: t.datePh })]),
          el('h3', { text: t.titlePh }),
          el('p', { text: t.excerptPh }),
          el('a', { href: '#posts', style: 'margin-top:auto;font-weight:700;padding-top:8px', text: t.readMore })
        ])
      ]));
    });
  }

  function render() {
    var zh = S.lang === 'zh', t = T[S.lang];
    document.documentElement.lang = zh ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-i]').forEach(function (n) { n.textContent = t[n.getAttribute('data-i')]; });
    var lb = document.getElementById('langBtn');
    lb.textContent = t.langBtn; lb.setAttribute('aria-label', t.langAria);
    renderGames(t, zh); renderMap(t, zh); renderPosts(t);
  }

  document.getElementById('langBtn').addEventListener('click', function () { S.lang = S.lang === 'zh' ? 'en' : 'zh'; save(); render(); });
  document.querySelectorAll('[data-filter]').forEach(function (a) {
    a.addEventListener('click', function () { S.filter = a.getAttribute('data-filter'); save(); render(); });
  });
  render();
})();
</script>
</body>
</html>
